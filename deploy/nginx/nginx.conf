# Prism 上云 Nginx：静态托管 prism-web + 逐条反代（对应 prism-web/vite.config.ts proxy 表 16 条）
# 反代 location 统一收敛在 /etc/nginx/locations.inc（HTTP/HTTPS 共用，改一处两侧生效）
# HTTPS 由挂载的 /etc/nginx/tls.d/*.conf 提供（证书就位后放文件；空目录=纯 HTTP 模式）
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  client_max_body_size 20m;
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # 限流（防公网刷口令/刷并发）：登录按分钟限、对话按连接数限
  # 注意：公司/办公网出口常多个同事共用一个公网 IP，登录限流不能设太紧，
  # 取 30 次/分钟 + burst 15（早高峰一次性登录不会误伤，同时仍能压住暴力破解）
  limit_req_zone  $binary_remote_addr zone=login_zone:10m rate=30r/m;
  limit_req_zone  $binary_remote_addr zone=api_zone:10m   rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream prism_api         { server prism-api:8002;       keepalive 32; }
  upstream sentiment_service { server prism-sentiment:8000; keepalive 32; }

  server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 纯 IP / HTTP 访问场景：去掉登录 cookie 的 Secure 标记
    # 原因：应用下发 Secure cookie，HTTP 下浏览器不保存，登录后立刻掉线（/auth/me 401）
    proxy_cookie_flags prism_token nosecure;

    include /etc/nginx/locations.inc;
  }

  # HTTPS server 块（挂载目录；无文件时为空 include，不报错）
  # 必须放在默认 80 server 之后：否则 tls.d 里的 80 server 会抢占默认匹配，
  # 用 IP 访问会被 301 跳到 HTTPS，触发证书不匹配警告
  include /etc/nginx/tls.d/*.conf;
}
